name: 🧪 CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Syntax check
        run: node tools/check.mjs

      - name: Lint
        run: npx --yes oxlint@1.90.0 --deny-warnings tgcloud tests tools

      - name: 🚫 No secrets tracked
        run: |
          if git ls-files | grep -Eq '(^|/)(secret\.js|\.env)$|^\.tgcloud/'; then
            echo "Runtime secrets or deploy state are tracked in git."
            exit 1
          fi

      - name: 🔐 Crypto primitives
        id: crypto
        continue-on-error: true
        run: node --import ./tests/register.mjs --test --test-reporter=spec tests/crypto.test.js

      - name: 🔑 Tokens & IDs
        id: ids
        continue-on-error: true
        run: node --import ./tests/register.mjs --test --test-reporter=spec tests/ids.test.js

      - name: 🗄️ Store & schema
        id: store
        continue-on-error: true
        run: node --import ./tests/register.mjs --test --test-reporter=spec tests/store.test.js

      - name: 🤖 Handlers & routing
        id: handlers
        continue-on-error: true
        run: node --import ./tests/register.mjs --test --test-reporter=spec tests/handlers.test.js

      - name: 🎨 Rendering & text
        id: render
        continue-on-error: true
        run: node --import ./tests/register.mjs --test --test-reporter=spec tests/render.test.js

      - name: 🛡️ Source guardrails
        id: source
        continue-on-error: true
        run: node --import ./tests/register.mjs --test --test-reporter=spec tests/source.test.js

      - name: 🧵 Topic coordination
        id: topics
        continue-on-error: true
        run: node --import ./tests/register.mjs --test --test-reporter=spec tests/topics.test.js

      - name: Policy invariants
        id: policy
        continue-on-error: true
        run: node --import ./tests/register.mjs --test --test-reporter=spec tests/policy.test.js

      - name: Plan invariants
        id: plan
        continue-on-error: true
        run: node --import ./tests/register.mjs --test --test-reporter=spec tests/plan.test.js

      - name: 📊 Test summary
        if: always()
        run: |
          {
            echo "## 📊 AmnPM test results"
            echo ""
            echo "| Section | Result |"
            echo "| --- | --- |"
            echo "| 🔐 Crypto primitives | ${{ steps.crypto.outcome == 'success' && '✅ passed' || '❌ failed' }} |"
            echo "| 🔑 Tokens & IDs | ${{ steps.ids.outcome == 'success' && '✅ passed' || '❌ failed' }} |"
            echo "| 🗄️ Store & schema | ${{ steps.store.outcome == 'success' && '✅ passed' || '❌ failed' }} |"
            echo "| 🤖 Handlers & routing | ${{ steps.handlers.outcome == 'success' && '✅ passed' || '❌ failed' }} |"
            echo "| 🎨 Rendering & text | ${{ steps.render.outcome == 'success' && '✅ passed' || '❌ failed' }} |"
            echo "| 🛡️ Source guardrails | ${{ steps.source.outcome == 'success' && '✅ passed' || '❌ failed' }} |"
            echo "| 🧵 Topic coordination | ${{ steps.topics.outcome == 'success' && '✅ passed' || '❌ failed' }} |"
            echo "| 📜 Policy invariants | ${{ steps.policy.outcome == 'success' && '✅ passed' || '❌ failed' }} |"
            echo "| 🗺️ Plan invariants | ${{ steps.plan.outcome == 'success' && '✅ passed' || '❌ failed' }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.crypto.outcome }}" != "success" ] \
            || [ "${{ steps.ids.outcome }}" != "success" ] \
            || [ "${{ steps.store.outcome }}" != "success" ] \
            || [ "${{ steps.handlers.outcome }}" != "success" ] \
            || [ "${{ steps.render.outcome }}" != "success" ] \
            || [ "${{ steps.source.outcome }}" != "success" ] \
            || [ "${{ steps.topics.outcome }}" != "success" ] \
            || [ "${{ steps.policy.outcome }}" != "success" ] \
            || [ "${{ steps.plan.outcome }}" != "success" ]; then
            echo "Some sections failed. Open the red step above for details." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "All sections passed." >> "$GITHUB_STEP_SUMMARY"
